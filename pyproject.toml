[project]
name = "mofjson"
version = "0.1.0"
description = "An LLM-oriented hierarchical representation and benchmark for metal-organic frameworks"
readme = "README.md"
authors = [
    { name = "Philippe Schwaller", email = "phischwaller@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mofjson = "mofjson.cli:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mofjson"]
